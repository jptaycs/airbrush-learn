[build]
  # scripts/generate-webp.mjs runs first to produce WebP siblings for hero/
  # gallery images (see that file and src/lib/optimizedImage.js) — it never
  # fails the build itself, so this is safe even if it errors internally.
  command = "node scripts/generate-webp.mjs && astro build"
  publish = "dist"
  # v2 (2026-09-03): batches ALL deploys to once daily instead of once per
  # push. Every ordinary git push -- n8n, /admin, gallery approvals -- is
  # skipped unconditionally; only the scheduled Netlify Build Hook
  # (.github/workflows/daily-deploy.yml, ~midnight America/New_York) is
  # allowed to actually build, and only if something changed. See
  # scripts/should-ignore-build.sh for the full mechanism and CLAUDE.md's
  # "Once-daily batched deploys" section for the reasoning and tradeoffs.
  # (v1, 2026-08-26, only skipped topics.json-only commits and turned out
  # not to work in production at all -- see git history / CLAUDE.md.)
  # Netlify convention: `ignore` exit 0 = skip the build, exit 1 = proceed.
  ignore = "bash scripts/should-ignore-build.sh"

[functions]
  directory = "netlify/functions"

# There is no prebuild fetch step. The n8n content pipeline commits finished
# articles (src/data/articles.json) and their hero images (public/images/) directly
# to this repo via the GitHub API as its last step, so by the time a build runs,
# the content is already sitting in the repo. As of 2026-09-03, a push to `main`
# no longer triggers a build directly — see `ignore` above: only the once-daily
# scheduled Build Hook does, batching whatever's accumulated since the last one.
